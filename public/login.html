<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — Kingdom Glory Church</title><meta name="theme-color" content="#060504"><link rel="icon" href="/images/kgc-logo.jpg">
<script src="/js/boot.js"></script><link rel="stylesheet" href="/css/style.css">
</head><body>
<main class="auth">
  <section class="auth-art"><a href="/"><img src="/images/kgc-logo.jpg" alt="Kingdom Glory Church"></a><blockquote>Enter into his gates with thanksgiving.</blockquote><span class="script" style="font-size:2rem">Psalm 100:4</span></section>
  <section class="auth-form">
    <a class="back" href="/">← BACK TO WEBSITE</a>
    <span class="label">MEMBER PORTAL</span><h1>Welcome back</h1><p class="lead" style="margin-bottom:2rem">Sign in to see your profile, giving and church activity.</p>
    <form id="loginForm" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
      <button class="btn btn-solid btn-wide" type="submit">Sign in</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
    <p class="alt-link">New to KGC? <a href="/register.html">Create your member account</a></p>
  </section>
</main>
<script src="/js/app.js"></script><script src="/js/login.js"></script>
</body></html>
