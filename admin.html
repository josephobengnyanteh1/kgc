<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KGC Admin Dashboard</title><link rel="stylesheet" href="css/style.css"><style>
.admin-wrap{max-width:1180px;margin:40px auto;padding:0 20px}.admin-head{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}.admin-head h1{margin:0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.toolbar button,.actions button{border:0;border-radius:8px;padding:11px 15px;cursor:pointer}.toolbar button.active,.primary{background:#c99a2e;color:#111}.panel{background:#fff;border-radius:14px;box-shadow:0 8px 30px #00000012;overflow:hidden}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:14px;border-bottom:1px solid #eee;text-align:left}.actions{display:flex;gap:7px;flex-wrap:wrap}.approve{background:#1f7a4d;color:white}.reject{background:#a83232;color:white}.view{background:#eee}.status{font-weight:700}.empty{padding:35px;text-align:center}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-card{background:white;max-width:650px;width:100%;max-height:90vh;overflow:auto;border-radius:16px;padding:25px}.photo{width:110px;height:110px;object-fit:cover;border-radius:50%;border:3px solid #c99a2e}.close{float:right;border:0;background:none;font-size:24px;cursor:pointer}@media(max-width:700px){.table th:nth-child(3),.table td:nth-child(3){display:none}.table{font-size:13px}}
</style></head><body><header class="site-header"><nav class="navbar container"><a class="brand" href="index.html"><img src="images/kgc-logo.jpg" alt="KGC"><span>Kingdom Glory Church</span></a></nav></header><main class="admin-wrap"><div class="admin-head"><div><p class="eyebrow dark">SECURE ADMINISTRATION</p><h1>Member Registration Dashboard</h1><p>Review and manage church member accounts.</p></div><button id="logout" class="btn btn-outline">Log out</button></div><div class="toolbar" id="filters"><button class="active" data-status="PENDING">Pending</button><button data-status="ACTIVE">Active</button><button data-status="REJECTED">Rejected</button><button data-status="SUSPENDED">Suspended</button></div><section class="panel"><table class="table"><thead><tr><th>Member</th><th>Branch</th><th>Submitted</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">Loading...</td></tr></tbody></table></section></main><div id="modal" class="modal"><div class="modal-card"><button class="close" id="close">×</button><div id="detail"></div></div></div><script src="admin.js"></script></body></html>
