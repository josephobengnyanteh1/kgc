<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KGC Finance</title><link rel="stylesheet" href="css/style.css"></head><body><main class="section"><div class="container"><p class="eyebrow dark">KINGDOM GLORY CHURCH</p><h1>Finance & Giving</h1><p>Record tithes, offerings and dues. Payment status is verified server-side.</p><section class="info-card"><h2>Record a payment</h2><form id="financeForm"><label>Type<select name="type"><option>TITHE</option><option>OFFERING</option><option>DUES</option></select></label><label>Amount (GHS)<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Payment method<select name="paymentMethod"><option>Cash</option><option>Mobile Money</option><option>Bank Transfer</option><option>Card</option></select></label><label>Reference<input name="reference" maxlength="120"></label><label>Description<textarea name="description" maxlength="500"></textarea></label><button class="btn btn-gold">Submit for verification</button><p id="msg"></p></form></section><section class="section"><h2>My payment records</h2><div id="records"></div></section></div></main><script src="finance.js"></script></body></html>
